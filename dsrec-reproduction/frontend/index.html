<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DSRec recommendation demo" />
    <title>DSRec Recommendations</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">DSRec</p>
        <h1>Personalized recommendations</h1>
        <p class="subtitle">Enter a user ID to get the model's top recommendations.</p>
      </section>

      <section class="panel">
        <form id="recommend-form" class="form">
          <label for="user-id">User ID</label>
          <div class="controls">
            <input id="user-id" name="user-id" type="number" min="1" value="1" required />
            <label class="top-k-label" for="top-k">Top K</label>
            <input id="top-k" name="top-k" type="number" min="1" max="100" value="10" required />
            <button id="submit" type="submit">Get recommendations</button>
          </div>
        </form>
        <p id="status" class="status" role="status">Ready.</p>
      </section>

      <section class="panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Results</p>
            <h2 id="results-title">Recommendations</h2>
          </div>
          <span id="model-version" class="badge">Model: —</span>
        </div>
        <div id="recommendations" class="grid" aria-live="polite">
          <div class="empty">Submit a user ID to load recommendations.</div>
        </div>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
