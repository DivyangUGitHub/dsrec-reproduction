seed: 42
data:
  processed_dir: data/processed
  max_sequence_length: 50 # demo-friendly; paper MovieLens config uses 200
  n_time_buckets: 10
model:
  d_model: 64
  n_blocks: 2
  d_state: 32
  conv_width: 4
  expansion: 2
  dropout: 0.2
  ssm_backend: torch # portable approximation; see paper_movielens.yaml for official Mamba
training:
  batch_size: 32
  validation_batch_size: 32
  epochs: 1
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip_norm: null
