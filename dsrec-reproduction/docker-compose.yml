services:
  dsrec-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DSREC_ROOT: /app
      DSREC_CHECKPOINT: data/checkpoints/best.pt
      DSREC_INTERACTIONS: data/processed/interactions.pkl
      DSREC_TIME_BUCKETIZER: data/processed/time_bucketizer.pkl
      DSREC_USER_MAPPING: data/processed/user_mapping.pkl
      DSREC_MAX_LEN: "50"
    restart: unless-stopped
