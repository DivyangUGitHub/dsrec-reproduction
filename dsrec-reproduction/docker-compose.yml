services:
  dsrec-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dsrec
      POSTGRES_USER: dsrec
      POSTGRES_PASSWORD: dsrec
    ports:
      - "5432:5432"
    volumes:
      - dsrec-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsrec -d dsrec"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dsrec-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DSREC_ROOT: /app
      DSREC_CHECKPOINT: data/checkpoints/best.pt
      DSREC_INTERACTIONS: data/processed/interactions.pkl
      DSREC_TIME_BUCKETIZER: data/processed/time_bucketizer.pkl
      DSREC_USER_MAPPING: data/processed/user_mapping.pkl
      DSREC_ITEM_MAPPING: data/processed/item_mapping.pkl
      DSREC_MAX_LEN: "50"
      DSREC_DATABASE_URL: postgresql+psycopg://dsrec:dsrec@dsrec-db:5432/dsrec
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./data/checkpoints:/app/data/checkpoints:ro
    depends_on:
      dsrec-db:
        condition: service_healthy
    restart: unless-stopped

  dsrec-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DSREC_API_INTERNAL_URL: http://dsrec-api:8000
    depends_on:
      - dsrec-api
    restart: unless-stopped

volumes:
  dsrec-postgres:
